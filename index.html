<body>
<body>

    <!-- Weather Card -->
    <div class="card">
        Welcome In Weather APP

</body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name" spellcheck="false">
            <button>
                <img src="Images/color search buttton.png" class="img2">
            </button>
        </div>
        <div class="weather">
            <img src="Images/normal2.png" class="weather-icon">
            <h1 class="temp">22 °C</h1>
            <h2 class="city">New Yourk</h2>
            <div class="details">
                <div class="col1">
                    <img src="Images/humidity.jfif" class="col-img">
                    <p class="hunmidity">50%</p>
                    <p>Humidity</p>
                </div>
                <div class="col1">
                    <img src="Images/wind.png" class="col-img">
                    <p class="wind">15 km\h</p>
                    <p>Wind</p>
                </div>
            </div>
        </div>
    </div>
        <script>
const apikey = "3b7b3a4f88fa11f5f00d093f543dc36b";

const apiurl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

const searchbox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");

async function checkweather(city) {

    if (city === "") {
        return;
    }

    const response = await fetch(apiurl + city + `&appid=${apikey}`);

    var data = await response.json();

    console.log(data);

    if (data.cod == 404) {
        document.querySelector(".city").innerHTML = "City not found";
        return;
    }

    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML =
        Math.round(data.main.temp) + "°C";

    document.querySelector(".hunmidity").innerHTML =
        data.main.humidity + "%";

    document.querySelector(".wind").innerHTML =
        data.wind.speed + " km/h";
}

searchBtn.addEventListener("click", () => {
    checkweather(searchbox.value);
});

checkweather("Bangalore");
</script>
</html>
